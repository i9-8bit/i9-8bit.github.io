<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Notes</title>

<style>
body{
    margin:0;
    background:#080a10;
    color:#fff;
    font-family:Arial,sans-serif
}

header{
    padding:18px 24px;
    background:#090b12;
    border-bottom:1px solid #252b38;
    display:flex;
    justify-content:space-between;
    align-items:center
}

nav a{
    color:#8ee5fa;
    text-decoration:none
}

main{
    max-width:1000px;
    margin:auto;
    padding:25px
}

h1{
    margin-bottom:5px
}

#chat{
    height:60vh;
    overflow:auto;
    background:#111620;
    border:1px solid #283142;
    border-radius:14px;
    padding:20px
}

.msg{
    margin:10px 0;
    padding:12px 15px;
    border-radius:10px;
    line-height:1.5;
    white-space:pre-wrap
}

.user{
    background:#173448;
    text-align:right
}

.ai{
    background:#19202c
}

.controls{
    display:flex;
    gap:10px;
    margin-top:12px
}

input{
    flex:1;
    padding:14px;
    border-radius:10px;
    border:1px solid #303847;
    background:#111620;
    color:#fff
}

button{
    padding:14px 18px;
    border:0;
    border-radius:10px;
    background:#00acd6;
    color:#fff;
    font-weight:bold;
    cursor:pointer
}

button:disabled{
    opacity:.5;
    cursor:not-allowed
}

select{
    padding:12px;
    border-radius:10px;
    background:#111620;
    color:#fff;
    border:1px solid #303847;
    margin-bottom:12px
}
</style>
</head>

<body>

<header>
    <strong>📚 School Notes</strong>

    <nav>
        <a href="index.html">Home</a> ·
        <a href="games.html">Games</a>
    </nav>
</header>

<main>

<h1> AI </h1>

<p>
    Math, writing, science, coding, recipes, studying,
    and basically anything else.
</p>

<select id="mode">
    <option>General</option>
    <option>Math</option>
    <option>ELA / Writing</option>
    <option>Science</option>
    <option>Coding</option>
    <option>Study</option>
    <option>Creative</option>
</select>


<p id="usage" style="color:#8ee5fa;font-weight:bold;margin:12px 0;">
10 / 10 AI requests remaining today
</p>
<div id="chat">
    <div class="msg ai">
        Hey! I'm an AI Chatbot. Ask me anything.
    </div>
</div>

<div class="controls">

    <input
        id="input"
        placeholder="Ask anything..."
        autocomplete="off"
    >

    <button id="send">
        Send
    </button>

</div>

</main>

<script>
const API =
    "https://i9-8bit-git-a848.fayyazgadgets.workers.dev/";

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const chat =
    document.getElementById("chat");

const mode =
    document.getElementById("mode");

const usage =
    document.getElementById("usage");

const messages = [];


/* =========================
   REQUEST COUNTER
========================= */

async function updateUsage(){

    try{

        const response =
            await fetch(API + "?usage");

        const data =
            await response.json();

        usage.textContent =
            `${data.remaining} / ${data.limit} AI requests remaining today`;

    }catch(error){

        usage.textContent =
            "AI request counter unavailable";

        console.error(error);

    }

}


/* =========================
   ADD CHAT MESSAGE
========================= */

function add(text,type){

    const div =
        document.createElement("div");

    div.className =
        "msg " + type;

    div.textContent =
        text;

    chat.appendChild(div);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================
   MODE PROMPT
========================= */

function systemPrompt(){

    return `
You are the AI assistant for INCRWD School Notes.

Current mode: ${mode.value}

Help the user clearly and accurately.

Math:
Explain the steps, not just the answer.

ELA / Writing:
Help with grammar, writing, reading,
outlines, explanations, and revisions.

Science:
Explain concepts clearly and accurately.

Coding:
Give working code and explain important parts.

Study:
Teach the material instead of simply giving answers.

Creative:
Help brainstorm and create ideas.

General:
Answer normally.

Be helpful, clear, concise, and age-appropriate.
`;
}


/* =========================
   ASK AI
========================= */

async function askAI(text){

    messages.push({
        role:"user",
        content:text
    });

    send.disabled = true;
    input.disabled = true;

    const loading =
        document.createElement("div");

    loading.className =
        "msg ai";

    loading.textContent =
        "Thinking...";

    chat.appendChild(loading);

    chat.scrollTop =
        chat.scrollHeight;

    try{

        const response =
            await fetch(API,{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    messages:[
                        {
                            role:"system",
                            content:systemPrompt()
                        },

                        ...messages
                    ]

                })

            });


        const data =
            await response.json();

        loading.remove();


        if(response.status === 429){

            add(
                data.message ||
                "You've used all 10 AI requests for today. Come back tomorrow.",
                "ai"
            );

            messages.pop();

            await updateUsage();

            return;
        }


        if(!response.ok){

            add(
                data.message ||
                data.error ||
                "The AI request failed.",
                "ai"
            );

            messages.pop();

            await updateUsage();

            return;
        }


        const reply =
            data?.choices?.[0]?.message?.content;


        if(!reply){

            add(
                "The AI returned no response.",
                "ai"
            );

            messages.pop();

            return;
        }


        messages.push({

            role:"assistant",
            content:reply

        });


        add(
            reply,
            "ai"
        );


        await updateUsage();


    }catch(error){

        loading.remove();

        messages.pop();

        add(
            "Could not connect to the AI server.",
            "ai"
        );

        console.error(error);

    }finally{

        send.disabled = false;
        input.disabled = false;

        input.focus();

    }

}


/* =========================
   SEND BUTTON
========================= */

send.onclick = () => {

    const text =
        input.value.trim();

    if(!text)
        return;

    add(
        text,
        "user"
    );

    input.value = "";

    askAI(text);

};


/* =========================
   ENTER KEY
========================= */

input.addEventListener(
    "keydown",
    event => {

        if(event.key === "Enter"){
            send.click();
        }

    }
);


/* =========================
   INITIAL COUNTER
========================= */

updateUsage();

</script>
</body>
</html>}

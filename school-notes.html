<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Notes</title>

<style>
body{
    margin:0;
    background:#080a10;
    color:#fff;
    font-family:Arial,sans-serif
}

header{
    padding:18px 24px;
    background:#090b12;
    border-bottom:1px solid #252b38;
    display:flex;
    justify-content:space-between;
    align-items:center
}

nav a{
    color:#8ee5fa;
    text-decoration:none
}

main{
    max-width:1000px;
    margin:auto;
    padding:25px
}

h1{
    margin-bottom:5px
}

#chat{
    height:60vh;
    overflow:auto;
    background:#111620;
    border:1px solid #283142;
    border-radius:14px;
    padding:20px
}

.msg{
    margin:10px 0;
    padding:12px 15px;
    border-radius:10px;
    line-height:1.5;
    white-space:pre-wrap
}

.user{
    background:#173448;
    text-align:right
}

.ai{
    background:#19202c
}

.controls{
    display:flex;
    gap:10px;
    margin-top:12px
}

input{
    flex:1;
    padding:14px;
    border-radius:10px;
    border:1px solid #303847;
    background:#111620;
    color:#fff
}

button{
    padding:14px 18px;
    border:0;
    border-radius:10px;
    background:#00acd6;
    color:#fff;
    font-weight:bold;
    cursor:pointer
}

button:disabled{
    opacity:.5;
    cursor:not-allowed
}

select{
    padding:12px;
    border-radius:10px;
    background:#111620;
    color:#fff;
    border:1px solid #303847;
    margin-bottom:12px
}
</style>
</head>

<body>

<header>
    <strong>📚 School Notes</strong>

    <nav>
        <a href="index.html">Home</a> ·
        <a href="games.html">Games</a>
    </nav>
</header>

<main>

<h1>📚 AI </h1>

<p>
    Math, writing, science, coding, recipes, studying,
    and basically anything else.
</p>

<select id="mode">
    <option>General</option>
    <option>Math</option>
    <option>ELA / Writing</option>
    <option>Science</option>
    <option>Coding</option>
    <option>Study</option>
    <option>Creative</option>
</select>


<p id="usage" style="color:#8ee5fa;font-weight:bold;margin:12px 0;">
10 / 10 AI requests remaining today
</p>
<div id="chat">
    <div class="msg ai">
        Hey! I'm an AI Chatbot. Ask me anything.
    </div>
</div>

<div class="controls">

    <input
        id="input"
        placeholder="Ask anything..."
        autocomplete="off"
    >

    <button id="send">
        Send
    </button>

</div>

</main>

<script>
const API="https://i9-8bit-git-a848.fayyazgadgets.workers.dev/";

async function updateUsage(){
    try{
        const r=await fetch(API+"?usage");
        const d=await r.json();

        document.getElementById("usage").textContent =
            `${d.remaining} / ${d.limit} AI requests remaining today`;
    }catch{
        document.getElementById("usage").textContent =
            "AI request counter unavailable";
    }
}

updateUsage();
</script>
</body>
</html>}
